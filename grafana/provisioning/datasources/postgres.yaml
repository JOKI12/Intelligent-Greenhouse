apiVersion: 1

datasources:
  - name: PostgreSQL-Greenhouse
    type: postgres
    access: proxy
    url: postgres:5432
    database: greenhouse_db
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: 'disable'
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1500
    isDefault: true
    editable: false
